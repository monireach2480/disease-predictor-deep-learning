{% extends "base.html" %}

{% block title %}Heart Disease Prediction{% endblock %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-10 mx-auto">
            <div class="mb-4">
                <h2>Heart Disease Risk Prediction</h2>
                <p class="text-muted">Enter patient information to assess heart disease risk</p>
            </div>
            
            <form method="POST" action="{{ url_for('predict_heart') }}">
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Age</label>
                            <input type="number" class="form-control" name="age" required min="20" max="100">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Sex</label>
                            <select class="form-select" name="sex" required>
                                <option value="">Select</option>
                                <option value="0">Female</option>
                                <option value="1">Male</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Chest Pain Type (cp)</label>
                            <select class="form-select" name="cp" required>
                                <option value="">Select</option>
                                <option value="0">Typical Angina</option>
                                <option value="1">Atypical Angina</option>
                                <option value="2">Non-anginal Pain</option>
                                <option value="3">Asymptomatic</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Resting Blood Pressure (trestbps)</label>
                            <input type="number" class="form-control" name="trestbps" required min="90" max="200">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Cholesterol (chol)</label>
                            <input type="number" class="form-control" name="chol" required min="100" max="600">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Fasting Blood Sugar > 120 mg/dl (fbs)</label>
                            <select class="form-select" name="fbs" required>
                                <option value="">Select</option>
                                <option value="0">False</option>
                                <option value="1">True</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Resting ECG (restecg)</label>
                            <select class="form-select" name="restecg" required>
                                <option value="">Select</option>
                                <option value="0">Normal</option>
                                <option value="1">ST-T Wave Abnormality</option>
                                <option value="2">Left Ventricular Hypertrophy</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Max Heart Rate (thalach)</label>
                            <input type="number" class="form-control" name="thalach" required min="60" max="220">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Exercise Induced Angina (exang)</label>
                            <select class="form-select" name="exang" required>
                                <option value="">Select</option>
                                <option value="0">No</option>
                                <option value="1">Yes</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">ST Depression (oldpeak)</label>
                            <input type="number" step="0.1" class="form-control" name="oldpeak" required min="0" max="6">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Slope of Peak Exercise ST Segment</label>
                            <select class="form-select" name="slope" required>
                                <option value="">Select</option>
                                <option value="0">Upsloping</option>
                                <option value="1">Flat</option>
                                <option value="2">Downsloping</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Number of Major Vessels (ca)</label>
                            <input type="number" class="form-control" name="ca" required min="0" max="4">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Thalassemia (thal)</label>
                            <select class="form-select" name="thal" required>
                                <option value="">Select</option>
                                <option value="0">Null</option>
                                <option value="1">Fixed Defect</option>
                                <option value="2">Normal</option>
                                <option value="3">Reversible Defect</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">Predict Heart Disease Risk</button>
                    <a href="{{ url_for('home') }}" class="btn btn-secondary btn-lg">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
